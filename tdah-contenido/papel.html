<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Archivo;src:url(fonts/archivo-black-latin-400-normal.woff2)}
@font-face{font-family:Inter;src:url(fonts/inter-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Inter;src:url(fonts/inter-latin-500-normal.woff2);font-weight:500}
:root{--bur:#7A1F2B;--burd:#4E121B;--amb:#E8A33D;--teal:#1F5C63;--teald:#123A3F;--cream:#F3E9D8;--paper:#EADBC2;--ink:#1E1A17;--e1:#b9a888;--e2:#a49373}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--teald);font-family:Inter,sans-serif;color:var(--ink)}
#cam{position:absolute;inset:0;transform-origin:50% 45%}
#stage{position:absolute;inset:0;overflow:hidden}
/* diorama de fondo: capas de cartulina */
.layer{position:absolute;left:-60px;right:-60px}
.layer svg{display:block;width:100%;height:100%}
#sky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#2a6f76 0%,var(--teal) 40%,var(--teald) 100%)}
#sun{position:absolute;left:640px;top:520px;width:300px;height:300px;border-radius:50%;background:var(--amb);box-shadow:0 10px 0 #b97d27,0 26px 40px rgba(0,0,0,.35)}
/* personaje */
#char{position:absolute;left:280px;top:420px;width:520px;transform-origin:50% 100%}
#char img{width:100%;display:block}
/* textos */
#handle{position:absolute;left:70px;top:96px;font:700 34px Inter;color:var(--cream);letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#handle b{color:var(--amb)}
.tag{position:absolute;left:70px;top:200px;padding:16px 30px 14px;background:var(--bur);color:var(--cream);font:400 36px Archivo;letter-spacing:3px;text-transform:uppercase;transform-origin:50% -40px;
 box-shadow:0 3px 0 var(--burd),0 6px 0 #3a0d14,0 14px 24px rgba(0,0,0,.35)}
.tag:before{content:'';position:absolute;left:50%;top:-40px;width:3px;height:40px;background:var(--cream);opacity:.8}
#title{position:absolute;left:70px;right:70px;top:345px;font-family:Archivo;font-size:112px;line-height:1.02;text-transform:uppercase;letter-spacing:2px;color:var(--cream)}
#title .ln{display:block;white-space:nowrap}
#title .ch{display:inline-block;transform-origin:50% 100%;
 text-shadow:0 1px 0 var(--e1),0 2px 0 var(--e1),0 3px 0 var(--e1),0 4px 0 var(--e2),0 5px 0 var(--e2),0 6px 0 var(--e2),0 7px 0 #8d7c5e,0 14px 22px rgba(0,0,0,.45)}
#title .hl .ch{color:var(--amb);text-shadow:0 1px 0 #c98a2c,0 2px 0 #c98a2c,0 3px 0 #b97d27,0 4px 0 #b97d27,0 5px 0 #a06a1f,0 6px 0 #a06a1f,0 7px 0 #8a5a18,0 14px 22px rgba(0,0,0,.45)}
#content{position:absolute;left:70px;right:70px}
.card{position:relative;background:var(--cream);border-radius:6px;box-shadow:0 3px 0 var(--e1),0 6px 0 var(--e2),0 16px 26px rgba(0,0,0,.35)}
.sub{font:700 42px Inter;line-height:1.3;padding:26px 32px;margin-top:22px;color:var(--ink)}
.sub em{font-style:normal;color:var(--bur)}
.big{font-family:Archivo;font-size:230px;line-height:1;color:var(--amb);
 text-shadow:0 2px 0 #c98a2c,0 4px 0 #b97d27,0 6px 0 #a06a1f,0 8px 0 #8a5a18,0 10px 0 #6e4712,0 24px 30px rgba(0,0,0,.45)}
.item{display:flex;align-items:center;gap:24px;font:700 44px Inter;padding:22px 28px;margin-top:20px}
.item .n{flex:none;width:70px;height:70px;border-radius:50%;background:var(--bur);color:var(--cream);font:400 40px Archivo;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--burd)}
.vs{display:flex;gap:28px;margin-top:10px}
.vs .card{flex:1;height:440px;padding:30px;display:flex;flex-direction:column;justify-content:flex-end;font:400 82px/0.98 Archivo;text-transform:uppercase}
.vs .card small{font:700 30px Inter;letter-spacing:4px;margin-bottom:16px}
.vs .a{background:var(--bur);color:var(--cream);box-shadow:0 3px 0 var(--burd),0 6px 0 #3a0d14,0 16px 26px rgba(0,0,0,.35)}
.vs .b{background:var(--amb);color:var(--ink);box-shadow:0 3px 0 #b97d27,0 6px 0 #8a5a18,0 16px 26px rgba(0,0,0,.35)}
.x{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 230px Archivo;color:var(--cream);opacity:.5}
#cta{position:absolute;left:70px;right:70px;top:1300px;text-align:center;padding:22px 30px;background:var(--amb);color:var(--ink);font:400 50px Archivo;text-transform:uppercase;letter-spacing:1px;border-radius:6px;
 box-shadow:0 3px 0 #b97d27,0 6px 0 #8a5a18,0 16px 26px rgba(0,0,0,.4)}
#credit{position:absolute;left:70px;right:70px;top:1408px;text-align:center;font:500 24px Inter;color:var(--cream);opacity:.75}
/* subtítulos */
#caps{position:absolute;left:90px;right:90px;top:1470px;height:140px;display:flex;align-items:center;justify-content:center}
#capbox{background:var(--cream);padding:18px 30px;border-radius:4px;font:700 48px/1.2 Inter;text-align:center;color:var(--ink);
 box-shadow:0 3px 0 var(--e1),0 6px 0 var(--e2),0 14px 22px rgba(0,0,0,.4);transform:rotate(-1deg)}
#capbox .on{color:var(--bur)}
/* luz, viñeta, grano */
#light{position:absolute;inset:0;background:radial-gradient(ellipse at 35% 25%,rgba(255,200,120,.38),transparent 55%);mix-blend-mode:screen;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(10,8,6,.55) 100%);pointer-events:none}
#grain{position:absolute;inset:0;opacity:.16;mix-blend-mode:multiply;pointer-events:none}
#fold{position:absolute;inset:0;background:var(--paper);transform-origin:0 50%;box-shadow:inset -40px 0 60px rgba(0,0,0,.25)}
</style></head>
<body>
<div id="cam"><div id="stage">
 <div id="sky"></div>
 <div class="layer" id="L1" style="top:900px;height:600px"><svg viewBox="0 0 1200 600" preserveAspectRatio="none"><path d="M0 220 C150 120 260 200 380 150 C520 90 600 210 760 140 C900 80 1020 170 1200 110 L1200 600 L0 600Z" fill="#2c7a80"/><path d="M0 232 C150 132 260 212 380 162 C520 102 600 222 760 152 C900 92 1020 182 1200 122" fill="none" stroke="#174a50" stroke-width="10"/></svg></div>
 <div class="layer" id="L2" style="top:1180px;height:800px"><svg viewBox="0 0 1200 800" preserveAspectRatio="none"><path d="M0 160 C200 60 330 190 520 120 C700 50 820 170 1000 100 C1080 70 1150 90 1200 80 L1200 800 L0 800Z" fill="#1d5258"/><path d="M0 172 C200 72 330 202 520 132 C700 62 820 182 1000 112 C1080 82 1150 102 1200 92" fill="none" stroke="#0f3236" stroke-width="12"/></svg></div>
 <div class="layer" id="L3" style="top:1500px;height:500px"><svg viewBox="0 0 1200 500" preserveAspectRatio="none"><path d="M0 120 L60 100 L130 130 L210 95 L300 125 L390 90 L480 120 L560 98 L650 128 L740 92 L830 118 L920 96 L1010 126 L1100 100 L1200 115 L1200 500 L0 500Z" fill="#EADBC2"/><path d="M0 132 L60 112 L130 142 L210 107 L300 137 L390 102 L480 132 L560 110 L650 140 L740 104 L830 130 L920 108 L1010 138 L1100 112 L1200 127" fill="none" stroke="#a49373" stroke-width="10"/></svg></div>
 <div id="char"><img src="personaje_papel.png"></div>
 <div id="handle">@george<b>crux1</b></div>
 <div class="tag" id="tag"></div>
 <div id="title"></div>
 <div id="content"></div>
 <div id="cta"></div>
 <div id="credit"></div>
 <div id="caps"><div id="capbox"></div></div>
 <div id="light"></div><div id="vig"></div>
 <svg id="grain" width="1080" height="1920"><filter id="gf"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="1"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#gf)"/></svg>
 <div id="fold"></div>
</div></div>
<script>
const FPS=30;
function anim(el,kf,start,dur,easing='linear'){return el.animate(kf,{duration:dur,delay:start,fill:'both',easing})}
// spring muestreado y cuantizado en pasos de 1/12 (sensación stop-motion)
function spring(n,{damping=11,stiffness=140,mass=1}={}){
  const out=[];let x=0,v=0;const dt=1/60;
  for(let i=0;i<n;i++){out.push(Math.round(x*12)/12);const a=(-stiffness*(x-1)-damping*v)/mass;v+=a*dt;x+=v*dt}
  out[n-1]=1;return out}
function springAnim(el,fn,start,frames=36,opts){const s=spring(frames,opts);
  return anim(el,s.map((p,i)=>Object.assign({offset:i/(s.length-1)},fn(p))),start,frames*1000/60)}
const bez='cubic-bezier(.45,0,.2,1)';
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
let CAP=[],COUNTERS=[];
window.build=function(c){
  const T=c.duration;
  // página que se dobla al inicio (rotateY −100° → 0°, 18 fotogramas, al revés: se abre)
  anim(document.getElementById('fold'),[{transform:'perspective(1800px) rotateY(0deg)'},{transform:'perspective(1800px) rotateY(-100deg)',opacity:1},{opacity:0}],0,600,'ease-in');
  // capas del diorama con paralaje
  anim(document.getElementById('L1'),[{transform:'translateY(40px)'},{transform:'translateY(-20px)'}],0,T,bez);
  anim(document.getElementById('L2'),[{transform:'translateY(70px)'},{transform:'translateY(-30px)'}],0,T,bez);
  anim(document.getElementById('L3'),[{transform:'translateY(110px)'},{transform:'translateY(0)'}],0,T,bez);
    anim(document.getElementById('cam'),[{transform:'scale(1)'},{transform:'scale(1.06)'}],0,T,bez);
  // personaje: entra grande, "habla" con rebotes de papel, luego baja a su esquina
  const ch=document.getElementById('char');
  springAnim(ch,p=>({transform:`translateY(${(1-p)*900}px) rotate(${(1-p)*-12}deg)`}),250,40,{damping:10,stiffness:120});
  const tagEl=document.getElementById('tag');tagEl.textContent=c.tag;
  const intro=h('div','tag',c.intro||c.tag);intro.style.cssText='left:50%;top:1250px;transform-origin:50% -40px;font-size:52px;translate:-50% 0';document.getElementById('stage').insertBefore(intro,document.getElementById('handle'));
  springAnim(intro,p=>({transform:`translateY(${(1-p)*-300}px) rotate(${(1-p)*8}deg)`,opacity:p>0?1:0}),500,40,{damping:7,stiffness:120});
  anim(intro,[{opacity:1},{opacity:0}],1700,150);
  anim(ch,[{transform:'none'},{transform:'translate(375px,-835px) scale(.36) rotate(4deg)'}],1750,600,bez);
  for(let t=2500;t<T-300;t+=900) anim(ch,[{rotate:'0deg'},{rotate:'-2deg'},{rotate:'1.5deg'},{rotate:'0deg'}],t,700,'steps(4)');
  // etiqueta que cae, se balancea 3° y se amortigua
  let t=1900;
  springAnim(tagEl,p=>({transform:`translateY(${(1-p)*-260}px) rotate(${(1-p)*14}deg)`,opacity:p>0?1:0}),t,48,{damping:6,stiffness:110});
  t+=350;
  // título: cada letra se despliega desde abajo
  const ti=document.getElementById('title');
  c.title.forEach((line,li)=>{const ln=h('span','ln'+((c.hl||[]).includes(li)?' hl':''));ti.appendChild(ln);
    [...line].forEach(chr=>{const s=h('span','ch',chr===' '?'&nbsp;':chr);ln.appendChild(s);
      springAnim(s,p=>({transform:`perspective(600px) rotateX(${(1-p)*-95}deg)`,opacity:p>0.02?1:0}),t,40);t+=28});t+=120});
  let fs=c.titleSize||112;ti.style.fontSize=fs+'px';
  while(fs>60&&[...ti.querySelectorAll('.ln')].some(l=>l.scrollWidth>ti.clientWidth)){fs-=4;ti.style.fontSize=fs+'px'}
  t+=200;
  const C=document.getElementById('content');C.style.top=(ti.offsetTop+ti.offsetHeight+40)+'px';
  const drop=(el,at,deg=6)=>springAnim(el,p=>({transform:`translateY(${(1-p)*-120}px) rotate(${(1-p)*deg}deg)`,opacity:p>0?1:0}),at,40,{damping:9,stiffness:130});
  const at=(i)=>c.at&&c.at[i]!=null?c.at[i]:null;
  let k=0;
  if(c.big!=null){const b=h('div','big');b.dataset.to=c.big;b.dataset.suf=c.bigSuffix||'';C.appendChild(b);const s=at(k++)??t;drop(b,s,-4);COUNTERS.push({el:b,start:s+150,to:+c.big,suf:c.bigSuffix||''});t=s+900}
  if(c.list){c.list.forEach((x,i)=>{const e=h('div','card item',`<div class="n">${i+1}</div><div>${x}</div>`);C.appendChild(e);const s=at(k++)??t;drop(e,s,i%2?3:-3);t=s+450});}
  if(c.vs){const V=h('div','vs');C.appendChild(V);
    const a=h('div','card a',`<small>${c.vs[0][0]}</small>${c.vs[0][1]}`),b=h('div','card b',`<small>${c.vs[1][0]}</small>${c.vs[1][1]}`);V.appendChild(a);V.appendChild(b);
    const xm=h('div','x','✕');a.appendChild(xm);
    const s1=at(k++)??t;drop(a,s1,-5);const s2=at(k++)??(s1+700);drop(b,s2,5);
    springAnim(xm,p=>({transform:`scale(${2-p})`,opacity:p}),s2+200,30);t=s2+700}
  (c.subs||[]).forEach(x=>{const e=h('div','card sub',x);C.appendChild(e);const s=at(k++)??t;drop(e,s,(k%2?3:-3));t=s+500});
  const cta=document.getElementById('cta');cta.textContent=c.cta;
  const cb=C.offsetTop+C.offsetHeight;window.__bottom=cb;const ctop=Math.min(1350,Math.max(1290,cb+36));cta.style.top=ctop+'px';document.getElementById('credit').style.top=(ctop+108)+'px';
  const ct=Math.max(t+300,T-2800);
  springAnim(cta,p=>({transform:`translateY(${(1-p)*200}px) rotate(${(1-p)*-4}deg)`,opacity:p>0?1:0}),ct,40,{damping:8,stiffness:120});
  const cr=document.getElementById('credit');cr.textContent=c.credit||'';anim(cr,[{opacity:0},{opacity:.75}],ct+300,400);
  // subtítulos: grupos de palabras; la que suena va en burdeos
  CAP=c.words||[];
  document.getAnimations().forEach(a=>a.pause());
  return ct;
};
let lastGroup=-1;
window.seek=function(ms){
  document.getAnimations().forEach(a=>a.currentTime=ms);
  const f=Math.floor(ms*FPS/1000);
  // temblor "a mano" cada 2 fotogramas, ±1,5 px
  const r=(n)=>{const x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)};
  const j=Math.floor(f/2);document.getElementById('stage').style.transform=`translate(${(r(j)*3-1.5).toFixed(2)}px,${(r(j+99)*3-1.5).toFixed(2)}px)`;
  document.getElementById('turb').setAttribute('seed',String(Math.floor(f/3)%50+1));
  document.getElementById('light').style.opacity=(1+(r(Math.floor(f/4)+7)*0.06-0.03)).toFixed(3);
  for(const k of COUNTERS){const p=Math.min(1,Math.max(0,(ms-k.start)/(40*1000/30)));const e=1-Math.pow(1-p,3);k.el.textContent=Math.round(k.to*e)+k.suf}
  // subtítulos
  const box=document.getElementById('capbox');
  const i=CAP.findIndex(w=>ms>=w.s&&ms<w.e);let cur=i;
  if(cur<0){const prev=CAP.filter(w=>w.e<=ms);cur=prev.length?CAP.indexOf(prev[prev.length-1]):-1;}
  if(cur<0||ms>CAP[CAP.length-1].e+600){box.style.visibility='hidden';return}
  box.style.visibility='visible';
  const g=CAP[cur].g;const words=CAP.filter(w=>w.g===g);
  box.innerHTML=words.map(w=>`<span class="${CAP.indexOf(w)===i?'on':''}">${w.w}</span>`).join(' ');
};
</script></body></html>
