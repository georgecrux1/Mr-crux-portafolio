<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Bebas;src:url(fontsource-bebas-neue-5.0.8/files/bebas-neue-latin-400-normal.woff2)}
@font-face{font-family:Grotesk;src:url(fontsource-space-grotesk-5.0.8/files/space-grotesk-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Grotesk;src:url(fontsource-space-grotesk-5.0.8/files/space-grotesk-latin-700-normal.woff2);font-weight:700}
:root{--mag:#FF2E88;--tur:#00E5D4;--bg:#0B0F1A;--ink:#F4F6FB;--dim:#A9B1C6;--yel:#FFD23F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Grotesk,sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden}
#cam{position:absolute;inset:0}
.blob{position:absolute;border-radius:50%;filter:blur(150px)}
#b1{width:950px;height:950px;background:var(--mag);left:-320px;top:-220px;opacity:.55}
#b2{width:850px;height:850px;background:var(--tur);right:-340px;bottom:180px;opacity:.4}
#b3{width:700px;height:700px;background:#7B2CFF;left:200px;top:900px;opacity:.25}
#grid{position:absolute;left:-50%;width:200%;height:950px;bottom:-140px;
 background-image:linear-gradient(var(--mag) 2px,transparent 2px),linear-gradient(90deg,var(--mag) 2px,transparent 2px);
 background-size:120px 120px;transform:perspective(600px) rotateX(62deg);opacity:.3;-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%)}
.pt{position:absolute;border-radius:50%;background:#fff}
#scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.7) 100%)}
#handle{position:absolute;top:175px;left:90px;font:700 34px Grotesk;letter-spacing:2px}
#handle span{color:var(--tur)}
#part{position:absolute;top:228px;left:90px;font:700 26px Grotesk;letter-spacing:6px;color:var(--yel)}
#prog{position:absolute;top:118px;left:90px;right:90px;display:flex;gap:14px}
#prog .seg{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
#prog .seg i{display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,var(--mag),var(--tur));box-shadow:0 0 18px var(--mag)}
#badge{position:absolute;left:830px;top:160px;width:160px;height:160px;border-radius:50%;overflow:hidden;border:5px solid var(--tur);box-shadow:0 0 30px rgba(0,229,212,.8)}
#badge img,.bigav img{width:100%;height:100%;display:block}
.scene{position:absolute;inset:0}
.bigav{position:absolute;left:290px;top:330px;width:500px;height:500px;border-radius:50%;overflow:hidden;border:10px solid var(--tur);box-shadow:0 0 90px rgba(0,229,212,.8),0 0 0 22px rgba(255,46,136,.4)}
.ring{position:absolute;left:290px;top:330px;width:500px;height:500px;border-radius:50%;border:6px solid var(--mag)}
.hookt{position:absolute;left:80px;right:80px;top:900px;text-align:center;font-family:Bebas;font-size:136px;line-height:.95;text-transform:uppercase}
.w{display:inline-block;margin:0 14px}
.hl{color:var(--mag);text-shadow:0 0 34px rgba(255,46,136,.85)}
.ht{color:var(--tur);text-shadow:0 0 34px rgba(0,229,212,.85)}
.num{position:absolute;right:-30px;top:250px;font-family:Bebas;font-size:620px;line-height:1;color:transparent;-webkit-text-stroke:6px rgba(255,255,255,.22)}
.numf{position:absolute;left:90px;top:300px;font-family:Bebas;font-size:120px;line-height:1;color:var(--yel);text-shadow:0 0 30px rgba(255,210,63,.7)}
.icon{position:absolute;left:290px;top:400px;width:500px;height:500px}
.icon svg{width:100%;height:100%;overflow:visible}
.icon svg *{fill:none;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.title{position:absolute;left:80px;right:80px;top:960px;text-align:center;font-family:Bebas;font-size:128px;line-height:.95;text-transform:uppercase}
.chip{position:absolute;left:0;right:0;top:1230px;display:flex;justify-content:center}
.chip div{display:flex;align-items:center;gap:16px;font:700 40px Grotesk;padding:16px 30px;border:3px solid var(--tur);background:rgba(0,229,212,.12);border-radius:60px}
.chip svg{width:40px;height:40px}
.tag{position:absolute;left:80px;right:80px;top:1340px;text-align:center;font:400 38px Grotesk;color:var(--dim)}
.stamp{position:absolute;left:90px;top:450px;font:700 30px Grotesk;letter-spacing:4px;color:var(--yel);border:4px solid var(--yel);padding:10px 18px;transform:rotate(-8deg)}
.bar{position:absolute;left:-400px;width:2000px;height:520px;transform:rotate(-12deg)}
.ctab{position:absolute;left:110px;right:110px;top:1260px;font:700 50px Grotesk;padding:28px;background:var(--mag);text-align:center;border-radius:14px;box-shadow:0 0 70px rgba(255,46,136,.7)}
#credit{position:absolute;left:90px;right:90px;top:1460px;font:400 25px Grotesk;color:var(--dim);text-align:center;opacity:.85}
</style></head>
<body><div id="stage"><div id="cam">
<div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div><div id="grid"></div>
<div id="pts"></div><div id="scenes"></div>
</div>
<div id="prog"></div><div id="handle">@elradar<span>delseis</span></div><div id="part"></div>
<div id="badge"><img src="avatar.jpg"></div>
<div id="credit"></div>
<div id="scan"></div><div id="vig"></div><div id="bars"></div>
</div>
<script>
const ICON={
 egg:`<path d="M30 150 Q100 205 170 150" stroke="#FF2E88"/><path d="M40 160 Q100 185 160 160" stroke="#FF2E88"/>
  <ellipse cx="70" cy="118" rx="22" ry="30" stroke="#00E5D4"/><ellipse cx="100" cy="105" rx="24" ry="33" stroke="#FFD23F"/><ellipse cx="130" cy="118" rx="22" ry="30" stroke="#00E5D4"/>
  <path d="M88 95 L96 103 L104 95 L112 103" stroke="#FF2E88"/><path d="M60 120 L80 120" stroke="#FF2E88"/>`,
 ufo:`<path d="M60 95 Q100 25 140 95" stroke="#00E5D4"/><ellipse cx="100" cy="100" rx="88" ry="24" stroke="#FF2E88"/>
  <circle cx="55" cy="102" r="5" stroke="#FFD23F"/><circle cx="100" cy="108" r="5" stroke="#FFD23F"/><circle cx="145" cy="102" r="5" stroke="#FFD23F"/>
  <path d="M75 126 L45 195 M125 126 L155 195 M90 128 L82 195 M110 128 L118 195" stroke="#00E5D4"/>`,
 foot:`<path d="M70 190 C40 185 40 130 55 100 C68 72 120 70 132 100 C145 130 140 160 125 180 C112 195 95 195 70 190 Z" stroke="#FF2E88"/>
  <ellipse cx="52" cy="70" rx="14" ry="17" stroke="#00E5D4"/><ellipse cx="80" cy="50" rx="13" ry="16" stroke="#00E5D4"/><ellipse cx="108" cy="46" rx="12" ry="15" stroke="#00E5D4"/><ellipse cx="133" cy="56" rx="11" ry="13" stroke="#00E5D4"/><ellipse cx="152" cy="76" rx="10" ry="12" stroke="#00E5D4"/>`,
 dog:`<path d="M55 70 L40 20 L85 50" stroke="#FF2E88"/><path d="M145 70 L160 20 L115 50" stroke="#FF2E88"/>
  <path d="M50 75 Q50 40 100 40 Q150 40 150 75 L150 120 Q150 175 100 178 Q50 175 50 120 Z" stroke="#00E5D4"/>
  <rect x="48" y="85" width="46" height="30" rx="10" stroke="#FFD23F"/><rect x="106" y="85" width="46" height="30" rx="10" stroke="#FFD23F"/><path d="M94 96 L106 96" stroke="#FFD23F"/>
  <ellipse cx="100" cy="140" rx="14" ry="10" stroke="#FF2E88"/><path d="M100 150 L100 160 M85 162 Q100 172 115 162" stroke="#FF2E88"/>`,
 crab:`<ellipse cx="100" cy="125" rx="58" ry="38" stroke="#FF2E88"/><path d="M80 90 L75 65 M120 90 L125 65" stroke="#00E5D4"/><circle cx="75" cy="60" r="7" stroke="#00E5D4"/><circle cx="125" cy="60" r="7" stroke="#00E5D4"/>
  <path d="M45 110 Q15 95 20 65 Q35 45 50 60 L38 75 Q30 90 45 95" stroke="#FFD23F"/><path d="M155 110 Q185 95 180 65 Q165 45 150 60 L162 75 Q170 90 155 95" stroke="#FFD23F"/>
  <path d="M50 135 L20 150 M55 148 L28 172 M150 135 L180 150 M145 148 L172 172" stroke="#FF2E88"/>`,
 bld:`<rect x="45" y="40" width="110" height="150" stroke="#00E5D4"/><path d="M30 190 L170 190" stroke="#FF2E88"/>
  <rect x="62" y="58" width="22" height="20" stroke="#FFD23F"/><rect x="116" y="58" width="22" height="20" stroke="#FFD23F"/><rect x="62" y="95" width="22" height="20" stroke="#FFD23F"/><rect x="116" y="95" width="22" height="20" stroke="#FF2E88"/><rect x="62" y="132" width="22" height="20" stroke="#FFD23F"/><rect x="116" y="132" width="22" height="20" stroke="#FFD23F"/>
  <path d="M88 190 L88 160 L112 160 L112 190" stroke="#FF2E88"/>`
};
const PIN=`<svg viewBox="0 0 24 24"><path d="M12 22s7-7.5 7-12a7 7 0 1 0-14 0c0 4.5 7 12 7 12z" fill="none" stroke="#00E5D4" stroke-width="2.5"/><circle cx="12" cy="10" r="2.6" fill="#FF2E88"/></svg>`;
const SPRING='cubic-bezier(.2,1.4,.35,1)', OUTX='cubic-bezier(.16,1,.3,1)', INX='cubic-bezier(.7,0,.84,0)';
function A(el,kf,t,d,e=OUTX,extra={}){return el.animate(kf,{delay:t,duration:d,fill:'both',easing:e,...extra})}
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function words(el,txt,t,step,hl=[],ht=[]){txt.split(' ').forEach((w,i)=>{const s=h('span','w'+(hl.includes(i)?' hl':'')+(ht.includes(i)?' ht':''),w.replace(/_/g,'&nbsp;'));el.appendChild(s);
  A(s,[{opacity:0,transform:'translateY(90px) rotate(8deg) scale(.6)',filter:'blur(12px)'},{opacity:1,transform:'none',filter:'blur(0)'}],t+i*step,620,SPRING)});return t+txt.split(' ').length*step}
// show a scene only within [s,e]
function window_(el,s,e){A(el,[{opacity:0},{opacity:1}],s,1,'linear');A(el,[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.92)'}],e-260,260,INX)}
function sweep(t){const B=document.getElementById('bars');
  [['#FF2E88',0],['#00E5D4',70],['#0B0F1A',140]].forEach(([c,dl],i)=>{const b=h('div','bar');b.style.background=c;b.style.top=(700+i*40)+'px';B.appendChild(b);
   A(b,[{transform:'rotate(-12deg) translateX(-2300px)'},{transform:'rotate(-12deg) translateX(2300px)'}],t-260+dl,560,'cubic-bezier(.65,0,.35,1)')})}
window.build=function(c){
  const T=c.total, S=document.getElementById('scenes');
  document.getElementById('part').textContent=c.part||'';
  document.getElementById('credit').textContent=c.credit||'';
  // ambient
  A(document.getElementById('b1'),[{transform:'translate(0,0)'},{transform:'translate(260px,380px)'},{transform:'translate(-60px,120px)'}],0,T,'ease-in-out');
  A(document.getElementById('b2'),[{transform:'translate(0,0)'},{transform:'translate(-260px,-300px)'},{transform:'translate(40px,-80px)'}],0,T,'ease-in-out');
  A(document.getElementById('b3'),[{transform:'translate(0,0) scale(1)'},{transform:'translate(-200px,-500px) scale(1.4)'}],0,T,'ease-in-out');
  A(document.getElementById('grid'),[{backgroundPosition:'0 0'},{backgroundPosition:`0 ${Math.round(T/1000*160)}px`}],0,T,'linear');
  A(document.getElementById('cam'),[{transform:'scale(1)'},{transform:'scale(1.06)'}],0,T,'linear');
  // particles (deterministic)
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const P=document.getElementById('pts');
  for(let i=0;i<46;i++){const p=h('div','pt');const s=3+rnd()*7;Object.assign(p.style,{width:s+'px',height:s+'px',left:(rnd()*1080)+'px',top:'1950px',opacity:.15+rnd()*.5,background:['#fff','#FF2E88','#00E5D4','#FFD23F'][i%4],boxShadow:`0 0 ${s*3}px currentColor`});P.appendChild(p);
    const d=5000+rnd()*7000;p.animate([{transform:'translate(0,0)'},{transform:`translate(${(rnd()-.5)*300}px,-2100px)`}],{duration:d,delay:-rnd()*d,iterations:Infinity,easing:'linear'})}
  // progress segments
  const secrets=c.segments.filter(s=>s.type==='secret');const PG=document.getElementById('prog');
  secrets.forEach(()=>{const s=h('div','seg');s.appendChild(h('i'));PG.appendChild(s)});
  const badge=document.getElementById('badge');
  let si=0;
  c.segments.forEach((g,k)=>{const s0=g.start,e0=g.start+g.dur;const sc=h('div','scene');S.appendChild(sc);
   if(g.type==='hook'){
     const ring=h('div','ring');sc.appendChild(ring);const av=h('div','bigav','<img src="avatar.jpg">');sc.appendChild(av);
     A(av,[{opacity:0,transform:'scale(.2) rotate(-25deg)'},{opacity:1,transform:'scale(1) rotate(0)'}],s0,700,SPRING);
     for(let r=s0+500;r<e0-300;r+=900)ring.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.45)',opacity:0}],{delay:r,duration:900,fill:'none',easing:'ease-out'});
     A(av,[{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],s0+700,1400,'ease-in-out',{iterations:Math.max(1,Math.floor((g.dur-1000)/1400))});
     const t=h('div','hookt');sc.appendChild(t);words(t,g.text,s0+350,130,g.hl||[],g.ht||[]);
     window_(sc,s0,e0);
     A(badge,[{opacity:0,transform:'scale(0)'},{opacity:1,transform:'scale(1)'}],e0-150,600,SPRING);
   } else if(g.type==='secret'){
     sweep(s0);
     const num=h('div','num',String(g.n).padStart(2,'0'));sc.appendChild(num);
     A(num,[{opacity:0,transform:'translateX(300px)',filter:'blur(20px)'},{opacity:1,transform:'translateX(0)',filter:'blur(0)'}],s0,700,OUTX);
     A(num,[{transform:'translateX(0)'},{transform:'translateX(-160px)'}],s0+700,Math.max(10,g.dur-900),'linear');
     const nf=h('div','numf','#'+g.n);sc.appendChild(nf);A(nf,[{opacity:0,transform:'translateX(-120px)'},{opacity:1,transform:'none'}],s0+120,500,SPRING);
     const ic=h('div','icon',`<svg viewBox="0 0 200 200">${ICON[g.icon]}</svg>`);sc.appendChild(ic);
     A(ic,[{opacity:0,transform:'scale(.5) rotate(-10deg)'},{opacity:1,transform:'scale(1) rotate(0)'}],s0+150,700,SPRING);
     ic.querySelectorAll('svg *').forEach((el,i)=>{el.setAttribute('pathLength','1');el.style.strokeDasharray='1';
       el.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{delay:s0+200+i*90,duration:900,fill:'both',easing:'cubic-bezier(.65,0,.35,1)'});
       el.animate([{filter:'drop-shadow(0 0 4px currentColor)'},{filter:'drop-shadow(0 0 22px '+el.getAttribute('stroke')+')'},{filter:'drop-shadow(0 0 4px currentColor)'}],{delay:s0+1000,duration:1600,iterations:Math.ceil(g.dur/1600),fill:'both'});});
     A(ic,[{transform:'translateY(0)'},{transform:'translateY(-26px)'},{transform:'translateY(0)'}],s0+850,1800,'ease-in-out',{iterations:Math.max(1,Math.ceil(g.dur/1800))});
     const ti=h('div','title');sc.appendChild(ti);let t=words(ti,g.title,s0+500,110,g.hl||[],g.ht||[]);
     const ch=h('div','chip',`<div>${PIN}<span>${g.place}</span></div>`);sc.appendChild(ch);A(ch.firstChild,[{opacity:0,transform:'translateY(60px) scale(.8)'},{opacity:1,transform:'none'}],t+150,600,SPRING);
     if(g.tag){const tg=h('div','tag',g.tag);sc.appendChild(tg);A(tg,[{opacity:0,transform:'translateY(30px)'},{opacity:1,transform:'none'}],t+500,500)}
     if(g.stamp){const st=h('div','stamp',g.stamp);sc.appendChild(st);A(st,[{opacity:0,transform:'rotate(-8deg) scale(2.6)'},{opacity:1,transform:'rotate(-8deg) scale(1)'}],s0+g.stampAt,380,'cubic-bezier(.5,0,.75,0)');
       A(document.getElementById('cam'),[{translate:'0 0'},{translate:'10px -8px'},{translate:'-8px 6px'},{translate:'0 0'}],s0+g.stampAt+380,180,'linear')}
     A(PG.children[si].firstChild,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],s0,g.dur,'linear');si++;
     window_(sc,s0,e0);
   } else if(g.type==='cta'){
     sweep(s0);
     const av=h('div','bigav','<img src="avatar.jpg">');av.style.top='300px';sc.appendChild(av);
     A(av,[{opacity:0,transform:'scale(.3) translateY(-200px)'},{opacity:1,transform:'none'}],s0,700,SPRING);
     A(badge,[{opacity:1},{opacity:0}],s0,200,'linear');
     const t=h('div','hookt');t.style.top='860px';t.style.fontSize='118px';sc.appendChild(t);const tt=words(t,g.text,s0+300,120,g.hl||[],g.ht||[]);
     const b=h('div','ctab',g.button);sc.appendChild(b);A(b,[{opacity:0,transform:'translateY(80px) scale(.8)'},{opacity:1,transform:'none'}],tt+100,600,SPRING);
     A(b,[{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],tt+800,800,'ease-in-out',{iterations:Math.max(1,Math.ceil((e0-tt)/800))});
     A(sc,[{opacity:0},{opacity:1}],s0,1,'linear');
   }
  });
  A(document.getElementById('credit'),[{opacity:0},{opacity:.85}],600,500,'linear');
  document.getAnimations().forEach(a=>a.pause());
};
window.seek=ms=>document.getAnimations().forEach(a=>a.currentTime=ms);
</script></body></html>
